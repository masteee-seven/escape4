<style>
  :root{
    --bg-dark:#12161d;
    --bg-panel:#1c222c;
    --bg-panel-2:#232a35;
    --metal:#3a4250;
    --metal-light:#4b5567;
    --accent-yellow:#f5a623;
    --accent-red:#e2503d;
    --accent-green:#3ecf8e;
    --text-light:#f4f1ea;
    --text-muted:#8a93a6;
    --stripe: repeating-linear-gradient(135deg, #f5a623 0 14px, #12161d 14px 28px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-dark);
    color:var(--text-light);
    font-family:'Noto Sans JP', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Zen Kaku Gothic New', sans-serif; font-weight:900;}
  .mono{font-family:'Share Tech Mono', monospace; letter-spacing:0.08em;}

  #app{max-width:760px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; z-index:1;}

  /* ---- top hazard stripe ---- */
  .hazard-strip{height:8px; background:var(--stripe); flex-shrink:0;}

  /* ---- header / dashboard ---- */
  header{
    padding:18px 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--metal);
    gap:12px;
    flex-wrap:wrap;
  }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand .eyebrow{font-size:11px; letter-spacing:0.2em; color:var(--accent-yellow); text-transform:uppercase;}
  .brand h1{font-size:19px; margin:0; line-height:1.3;}
  .gauge-cluster{display:flex; align-items:center; gap:14px;}
  .gauge{
    background:var(--bg-panel-2); border:1px solid var(--metal);
    border-radius:10px; padding:8px 14px; text-align:center; min-width:78px;
  }
  .gauge .label{font-size:10px; color:var(--text-muted); letter-spacing:0.1em;}
  .gauge .value{font-size:20px; margin-top:2px;}
  #timerValue.warn{color:var(--accent-red);}

  main{flex:1; padding:20px; display:flex; flex-direction:column; gap:20px;}

  /* ---- bay row (progress, signature element) ---- */
  .bay-row{display:flex; flex-wrap:wrap; gap:6px; padding:14px; background:var(--bg-panel); border-radius:12px; border:1px solid var(--metal);}
  .bay{
    flex:1 1 40px; min-width:36px; position:relative; height:44px; border-radius:6px; overflow:hidden;
    background:var(--bg-dark); border:1px solid var(--metal);
  }
  .bay .num{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:var(--text-muted); z-index:1; font-family:'Share Tech Mono', monospace;
  }
  .bay.done .num{color:var(--bg-dark);}
  .bay.current{border-color:var(--accent-yellow);}
  .bay.failed{border-color:var(--accent-red);}
  .bay.failed .num{color:var(--accent-red); z-index:3;}
  .bay.failed::after{
    content:"×"; position:absolute; inset:0; z-index:3;
    display:flex; align-items:center; justify-content:center;
    color:var(--accent-red); font-size:20px; font-weight:900;
  }
  .shutter{
    position:absolute; inset:0; z-index:2;
    background:repeating-linear-gradient(0deg, var(--metal) 0 6px, var(--metal-light) 6px 11px);
    transform:translateY(0%);
    transition:transform 0.9s cubic-bezier(.4,1.4,.4,1);
  }
  .bay.done .shutter{transform:translateY(-100%);}
  .bay.done{background:var(--accent-green);}

  /* ---- panel / card ---- */
  .panel{
    background:var(--bg-panel); border:1px solid var(--metal); border-radius:14px;
    padding:24px; position:relative;
  }
  .bay-tag{
    display:flex; align-items:center; gap:8px; width:100%;
    font-size:12px; color:var(--accent-yellow); letter-spacing:0.1em;
    margin-bottom:10px; text-transform:uppercase;
  }
  .bay-tag .dot{width:7px; height:7px; border-radius:50%; background:var(--accent-yellow);}
  .panel h2{font-size:20px; margin:0 0 14px;}
  .scenario{
    background:var(--text-light); color:#1c1f26; border-left:3px solid var(--accent-yellow);
    padding:14px 16px; border-radius:6px; font-size:15px; line-height:1.8; margin-bottom:18px;
  }
  .choices{display:flex; flex-direction:column; gap:10px;}
  .choice{
    display:flex; gap:12px; align-items:flex-start; text-align:left;
    background:var(--bg-panel-2); border:1px solid var(--metal); color:var(--text-light);
    padding:13px 16px; border-radius:8px; cursor:pointer; font-size:14.5px; line-height:1.6;
    font-family:inherit; transition:border-color .15s, background .15s;
  }
  .choice:hover{border-color:var(--metal-light);}
  .choice .letter{
    font-family:'Share Tech Mono', monospace; color:var(--accent-yellow); flex-shrink:0; font-size:14px;
  }
  .choice.correct{border-color:var(--accent-green); background:rgba(62,207,142,0.1);}
  .choice.wrong{border-color:var(--accent-red); background:rgba(226,80,61,0.1);}
  .choice[disabled]{cursor:default;}

  .feedback{margin-top:18px; padding:16px; border-radius:8px; font-size:14.5px; line-height:1.8;}
  .feedback.ok{background:rgba(62,207,142,0.1); border:1px solid var(--accent-green);}
  .feedback.ng{background:rgba(226,80,61,0.08); border:1px solid var(--metal-light);}
  .feedback .code-line{margin-top:10px; font-size:13px; color:var(--text-muted);}
  .feedback .code-digit{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:5px; background:var(--accent-green); color:var(--bg-dark);
    font-family:'Share Tech Mono', monospace; font-weight:700; margin-left:6px;
  }

  button.primary{

  .confetti-piece{

  .gameover-stripe{

  @media (max-width:480px){
    .gauge-cluster{gap:8px;}
    .gauge{min-width:64px; padding:6px 8px;}

  }

  /* ---- matrix background (PC only) ---- */
  #matrixCanvas{
    position:fixed; inset:0; width:100%; height:100%;
    z-index:0; pointer-events:none; display:none;
  }
  @media (min-width:900px){
    #matrixCanvas{ display:block; }
  }
</style>
</head>

function renderBayRow(){

function fmtTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return m+':'+s;
}

function startTimer(){
  state.startedAt = Date.now();
  state.timerId = setInterval(()=>{
    state.secondsLeft--;
    if(state.secondsLeft<=0){
      state.secondsLeft = 0;
      clearInterval(state.timerId);
    }
    timerValue.textContent = fmtTime(state.secondsLeft);
    if(state.secondsLeft <= 180) timerValue.classList.add('warn');
  },1000);
}

function shuffleIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=arr.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

  state.stageIndex = i;

      <button class="ghost" id="speakQBtn" style="margin-bottom:14px;">🔊 問いを読み上げる</button>
      <div class="choices" id="choicesWrap">
        ${shuffleIndices(s.choices.length).map((origIdx,displayIdx)=>`<button class="choice" data-i="${origIdx}"><span class="letter">${String.fromCharCode(65+displayIdx)}</span><span>${s.choices[origIdx]}</span></button>`).join('')}
      </div>

  `;
  document.getElementById('speakQBtn').addEventListener('click', ()=>speakQuestion(i));
  document.querySelectorAll('#choicesWrap .choice').forEach(btn=>{
    btn.addEventListener('click', ()=>handleAnswer(i, parseInt(btn.dataset.i)));

function handleAnswer(stageIdx, choiceIdx){
  const s = STAGES[stageIdx];
  const buttons = document.querySelectorAll('#choicesWrap .choice');
  buttons.forEach(b=>b.setAttribute('disabled','true'));
  const isCorrect = choiceIdx === s.correct;
  const clickedBtn = document.querySelector(`#choicesWrap .choice[data-i="${choiceIdx}"]`);
  clickedBtn.classList.add(isCorrect ? 'correct' : 'wrong');
  if(!isCorrect){
    const correctBtn = document.querySelector(`#choicesWrap .choice[data-i="${s.correct}"]`);
    correctBtn.classList.add('correct');
  }

  state.answered[stageIdx] = true;
  if(isCorrect){
    state.bayResult[stageIdx] = 'ok';
    state.code[stageIdx] = s.digit;
    playCorrectSound();
    playDoorOpenAnimation();
  } else {
    state.bayResult[stageIdx] = 'ng';
    state.wrongCount++;
    gaugeMiss.textContent = `${state.wrongCount}/${MAX_MISS}`;
    showFailStamp();
    if(state.wrongCount < MAX_MISS){ playWrongSound(); }
  }
  renderBayRow();

  if(state.wrongCount >= MAX_MISS){
    triggerGameOver();
    return;
  }

  if(!isCorrect){
    flashScreen(1); // 間違うたびに1回、画面を赤く明滅させる
  }

  const fb = document.getElementById('feedbackWrap');
  fb.innerHTML = `
    <div class="feedback ${isCorrect ? 'ok' : 'ng'}">
      <div><strong style="${isCorrect ? '' : 'color:var(--accent-red);'}">${isCorrect ? '✔ シャッター解除' : '✕ シャッターは開かなかった'}</strong>：${s.explain}</div>
      <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--metal);">
        <strong style="color:var(--accent-yellow);">なぜ流されるのか(性弱説の視点)</strong>：${s.why}
      </div>
      ${isCorrect ? `<div class="code-line">獲得コード：<span class="code-digit">${s.digit}</span></div>` : `<div class="code-line" style="color:var(--accent-red);">このベイのコードは獲得できなかった</div>`}
    </div>
  `;

  const btnLabel = stageIdx < STAGES.length-1 ? '次の整備ベイへ' : '最終ゲートへ';
  fb.innerHTML += `<button class="primary" id="nextBtn">${btnLabel}</button>`;
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(stageIdx < STAGES.length-1){ renderStage(stageIdx+1); }
    else { renderVault(); }
  });
}

    utter.lang = 'ja-JP';
    utter.rate = rate;
    utter.pitch = 1.0;
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
  }catch(e){ /* 読み上げに対応していない環境では無視 */ }
}

function playCorrectSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    // ピンポン(正解チャイム): 高い音→低い音
    [880, 659.25].forEach((freq,i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(gain); gain.connect(ctx.destination);
      const t0 = now + i*0.16;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.3, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.3);
      osc.start(t0);
      osc.stop(t0+0.32);
    });
  }catch(e){ /* audio再生に対応していない環境では無視 */ }
}

function playWrongSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = 220;
    osc.connect(gain); gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.25, now+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+0.28);
    osc.start(now);
    osc.stop(now+0.3);
  }catch(e){ /* audio再生に対応していない環境では無視 */ }
}

/* ---------------- ホーム画面ループBGM ---------------- */
let bgmCtx = null;
let bgmGain = null;
let bgmSchedulerId = null;
let bgmPlaying = false;
let bgmStepIndex = 0;
let bgmNextNoteTime = 0;
const BGM_TEMPO = 132; // bpm
const BGM_STEP = 60/BGM_TEMPO/2; // 8分音符の長さ(秒)
// 16ステップの繰り返しループ(不穏さと駆動感のあるマイナー調アルペジオ)
const BGM_MELODY = [220.00,0,261.63,293.66, 329.63,0,392.00,0, 349.23,0,329.63,293.66, 261.63,0,220.00,0];
const BGM_BASS   = [110.00,0,0,0, 0,0,0,0, 130.81,0,0,0, 0,0,0,0];

function scheduleBgm(){
  while(bgmNextNoteTime < bgmCtx.currentTime + 0.12){
    const step = bgmStepIndex % BGM_MELODY.length;
    playBgmNote(BGM_MELODY[step], bgmNextNoteTime, 'square', 0.14);
    playBgmNote(BGM_BASS[step], bgmNextNoteTime, 'triangle', 0.22);
    bgmNextNoteTime += BGM_STEP;
    bgmStepIndex++;
  }
}

function playBgmNote(freq, time, type, peak){
  if(!freq) return;
  const osc = bgmCtx.createOscillator();
  const gain = bgmCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  osc.connect(gain); gain.connect(bgmGain);
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(peak, time+0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, time+BGM_STEP*0.95);
  osc.start(time);
  osc.stop(time+BGM_STEP);
}

function startBGM(){
  if(bgmPlaying) return;
  try{
    if(!bgmCtx){ bgmCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(bgmCtx.state === 'suspended'){ bgmCtx.resume(); }
    bgmGain = bgmCtx.createGain();
    bgmGain.gain.value = 0.45;
    bgmGain.connect(bgmCtx.destination);
    bgmStepIndex = 0;
    bgmNextNoteTime = bgmCtx.currentTime + 0.05;
    bgmPlaying = true;
    bgmSchedulerId = setInterval(scheduleBgm, 50);
  }catch(e){ /* audio再生に対応していない環境では無視 */ }
}

function stopBGM(){
  bgmPlaying = false;
  if(bgmSchedulerId){ clearInterval(bgmSchedulerId); bgmSchedulerId = null; }
  if(bgmGain){
    try{ bgmGain.gain.setTargetAtTime(0, bgmCtx.currentTime, 0.05); }catch(e){}
  }
}

function playFanfare(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5-E5-G5-C6の上昇フレーズ
    notes.forEach((freq,i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      osc.connect(gain); gain.connect(ctx.destination);
      const t0 = now + i*0.15;
      const dur = 0.18;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.3, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      osc.start(t0);
      osc.stop(t0+dur+0.05);
    });
    // 最後にホールドする和音
    const chordAt = now + notes.length*0.15;
    [783.99, 1046.5, 1318.5].forEach(freq=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      osc.connect(gain); gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.0001, chordAt);
      gain.gain.exponentialRampToValueAtTime(0.25, chordAt+0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, chordAt+0.8);
      osc.start(chordAt);
      osc.stop(chordAt+0.85);
    });
  }catch(e){ /* audio再生に対応していない環境では無視 */ }
}

function flashScreen(times, withSiren){
  const flash = document.createElement('div');
  flash.className = 'alert-flash';
  flash.style.animation = `flashAlert 0.45s ease-in-out ${times}`;
  document.body.appendChild(flash);
  if(withSiren) playSiren();
  const totalMs = times*450 + 150;
  return new Promise(resolve=>{
    setTimeout(()=>{ flash.remove(); resolve(); }, totalMs);
  });
}

function playSiren(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.connect(gain);
    gain.connect(ctx.destination);
    const now = ctx.currentTime;
    const duration = 1.8;
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.22, now + 0.05);
    for(let i=0;i<4;i++){
      const t0 = now + i*0.45;
      osc.frequency.setValueAtTime(600, t0);
      osc.frequency.linearRampToValueAtTime(920, t0+0.22);
      osc.frequency.linearRampToValueAtTime(600, t0+0.45);
    }
    gain.gain.setValueAtTime(0.22, now+duration-0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, now+duration);
    osc.start(now);
    osc.stop(now+duration);
  }catch(e){ /* audio再生に対応していない環境では無視 */ }
}

function renderResult(){
  clearInterval(state.timerId);
  state.finishedAt = Date.now();
  const elapsed = cumulativeElapsed + (TOTAL_SECONDS - state.secondsLeft);
  headerTitle.textContent = "脱出成功";
  playFanfare();
  launchConfetti();
  screen.innerHTML = `
    <div class="panel">
      <div class="bay-tag"><span class="dot"></span>MISSION COMPLETE</div>
      <h2>脱出成功。お疲れ様でした。</h2>
      <div class="result-summary">
        <div class="box"><div class="n">${fmtTime(elapsed)}</div><div class="l">かかった時間</div></div>
        <div class="box"><div class="n">${STAGES.length}/${STAGES.length}</div><div class="l">突破ベイ数</div></div>
        <div class="box"><div class="n mono">${state.code.join('')}</div><div class="l">脱出コード</div></div>
      </div>

      <h2 style="margin-top:24px;">振り返り：今日の10のポイント</h2>
      ${STAGES.map(s=>`
        <div class="recap-item">
          <div class="theme">${s.theme}</div>
          <div class="point">${s.recap}</div>
        </div>
      `).join('')}

      <div style="margin-top:20px;">
        <div style="font-weight:700; font-size:14.5px;">チームで話してみよう</div>
        <p style="color:var(--text-muted); font-size:13.5px; line-height:1.8; margin-top:6px;">
          この10個の場面のうち、自分の店舗・持ち場で実際に起こりそうなものはどれですか？<br>
          気づいたこと・チームの意見をメモしておきましょう。
        </p>
        <textarea class="reflect" id="reflectInput" placeholder="例：ベイ6の打刻の話、うちの店舗でもありそう…"></textarea>
      </div>

      <button class="primary" id="sheetBtn">結果をスプレッドシートに送信</button>
      <div id="sheetStatus" style="font-size:12.5px; color:var(--text-muted); margin-top:8px; text-align:center;"></div>

      <button class="ghost" id="copyBtn">結果をテキストでコピー(店舗報告用)</button>
      <div class="copy-box" id="copyPreview"></div>
    </div>
  `;

  const updatePreview = ()=>{
    const reflect = document.getElementById('reflectInput').value.trim();
    const text =
`【コンプラ脱出ゲーム 結果】
チーム名：${state.teamName}
クリアタイム：${fmtTime(elapsed)}
脱出コード：${state.code.join('')}
振り返りメモ：${reflect || '(未記入)'}`;
    document.getElementById('copyPreview').textContent = text;
    return text;
  };
  document.getElementById('reflectInput').addEventListener('input', updatePreview);
  updatePreview();

  document.getElementById('sheetBtn').addEventListener('click', ()=>{
    const statusEl = document.getElementById('sheetStatus');
    if(!GOOGLE_FORM_CONFIG.actionUrl){
      statusEl.textContent = 'スプレッドシート連携が未設定です(担当者にご確認ください)。下の「テキストでコピー」をご利用ください。';
      return;
    }
    const reflect = document.getElementById('reflectInput').value.trim();
    statusEl.textContent = '送信中…';

    // 隠しiframe + フォームPOSTでGoogleフォームへ送信(fetchのCORS制限を受けにくい方式)
    let iframe = document.getElementById('gformTargetFrame');
    if(!iframe){
      iframe = document.createElement('iframe');
      iframe.id = 'gformTargetFrame';
      iframe.name = 'gformTargetFrame';
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
    }
    const form = document.createElement('form');
    form.action = GOOGLE_FORM_CONFIG.actionUrl;
    form.method = 'POST';
    form.target = 'gformTargetFrame';

    const fields = {
      [GOOGLE_FORM_CONFIG.entryTeamName]: state.teamName,
      [GOOGLE_FORM_CONFIG.entryElapsed]: fmtTime(elapsed),
      [GOOGLE_FORM_CONFIG.entryCode]: state.code.join(''),
      [GOOGLE_FORM_CONFIG.entryReflect]: reflect
    };
    Object.keys(fields).forEach(name=>{
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = name;
      input.value = fields[name];
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();
    document.body.removeChild(form);

    // 隠しiframeの読み込み完了を送信完了の目安として表示(内容までは確認できません)
    iframe.onload = ()=>{
      statusEl.textContent = '送信しました(スプレッドシート側でご確認ください)';
      showToast('送信しました');
    };
    setTimeout(()=>{
      if(statusEl.textContent === '送信中…'){
        statusEl.textContent = '送信しました(スプレッドシート側でご確認ください)';
      }
    }, 3000);
  });

  document.getElementById('copyBtn').addEventListener('click', ()=>{
    const text = updatePreview();
    navigator.clipboard.writeText(text).then(()=>{
      showToast('コピーしました');
    }).catch(()=>{
      showToast('コピーできませんでした。手動で選択してください');
    });
  });
}

function toggleFullscreen(){
  const el = document.documentElement;
  if(!document.fullscreenElement){
    (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen || function(){}).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen || function(){}).call(document);
  }
}
document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);

// ブラウザの自動再生制限対策: 最初のユーザー操作でBGMの再開を試みる
function unlockAudioOnFirstInteraction(){
  if(bgmCtx && bgmCtx.state === 'suspended'){ bgmCtx.resume(); }
  if(!bgmPlaying && !state.startedAt){ startBGM(); }
}
['pointerdown','keydown','touchstart'].forEach(evt=>{
  document.addEventListener(evt, unlockAudioOnFirstInteraction, { once:true });
});

// タブを離れる・バックグラウンドに回った・ページを閉じる際は確実にBGMを止める
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    stopBGM();
  } else if(!state.startedAt && !bgmPlaying){
    startBGM();
  }
});
window.addEventListener('pagehide', stopBGM);
window.addEventListener('beforeunload', stopBGM);

/* ---------------- 背景デジタルレイン(PC限定) ---------------- */
(function setupMatrixRain(){
  const canvas = document.getElementById('matrixCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  // 元祖Matrixに寄せて半角カタカナ+数字+記号を使用
  const katakana = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜｦﾝ';
  const chars = (katakana + '0123456789').split('');
  const fontSize = 18;
  let columns = 0;
  let drops = [];
  let rafId = null;
  let running = false;

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    columns = Math.floor(canvas.width / fontSize);
    drops = new Array(columns).fill(0).map(()=>Math.floor(Math.random()* -60));
  }

  function draw(){
    ctx.fillStyle = 'rgba(0,0,0,0.075)'; // 直前フレームをうっすら残して尾を引かせる(黒背景でクラシックな見た目に)
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.font = fontSize + 'px "Share Tech Mono", monospace';
    ctx.textAlign = 'center';
    for(let i=0;i<columns;i++){
      const char = chars[Math.floor(Math.random()*chars.length)];
      const x = i*fontSize + fontSize/2;
      const y = drops[i]*fontSize;

      // 先頭の文字は白に近い明るい緑でグロー、後続はやや暗い緑のトレイル
      const isHead = Math.random() < 0.12;
      if(isHead){
        ctx.shadowColor = 'rgba(140,255,170,0.9)';
        ctx.shadowBlur = 8;
        ctx.fillStyle = 'rgba(210,255,225,0.95)';
      } else {
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(40,200,110,0.55)';
      }
      ctx.fillText(char, x, y);

      if(y > canvas.height && Math.random() > 0.975){
        drops[i] = 0;
      }
      drops[i]++;
    }
    ctx.shadowBlur = 0;
    if(running){ rafId = requestAnimationFrame(draw); }
  }

  function isDesktop(){
    return window.matchMedia('(min-width:900px)').matches;
  }

  function start(){
    if(running || !isDesktop()) return;
    running = true;
    rafId = requestAnimationFrame(draw);
  }
  function stop(){
    running = false;
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
  }

  resize();
  window.addEventListener('resize', ()=>{
    resize();
    if(isDesktop()){ start(); } else { stop(); }
  });
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ stop(); } else { start(); }
  });
  start();
})();

/* ---------------- 起動 ---------------- */
renderStart();
</script>
</body>
</html>
